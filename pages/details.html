<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details | MStream</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../dist/output.css">
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100">

    <header class="border-b border-neutral-800 bg-neutral-900">
        <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
            <a href="./home.html" class="text-lg font-semibold text-white">MStream</a>
            <nav class="flex items-center gap-1 text-sm">
                <a href="./home.html" class="rounded-md px-3 py-1.5 text-neutral-400 hover:text-white">Home</a>
                <a href="./movies.html" class="rounded-md px-3 py-1.5 text-neutral-400 hover:text-white">Movies</a>
                <a href="./tv-series.html" class="rounded-md px-3 py-1.5 text-neutral-400 hover:text-white">TV Series</a>
                <a href="./favorites.html" class="rounded-md px-3 py-1.5 text-neutral-400 hover:text-white">Favorites</a>
            </nav>
        </div>
    </header>

    <main id="movieDetails" class="mx-auto max-w-4xl px-6 py-8">

        <div class="rounded-lg border border-neutral-800 bg-neutral-900 p-6">
            <div class="flex flex-col gap-6 md:flex-row">

                <img
                    id="detailPoster"
                    src=""
                    alt="Movie poster"
                    class="h-80 w-full rounded-md object-cover md:w-52"
                >

                <div class="flex-1">
                    <h1 id="detailTitle" class="text-2xl font-bold text-white">Movie Title</h1>
                    <p id="detailOverview" class="mt-3 text-sm leading-6 text-neutral-400">Overview</p>

                    <div class="mt-4 space-y-1 text-sm text-neutral-400">
                        <p><span class="text-white">Release:</span> <span id="detailDate">—</span></p>
                        <p><span class="text-white">Rating:</span> <span id="detailRating">—</span></p>
                    </div>

                    <div class="mt-6 flex flex-wrap gap-3">
                        <button id="watchButton" type="button" class="rounded-md bg-white px-5 py-2 text-sm font-medium text-black hover:bg-neutral-200">
                            Watch Now
                        </button>
                        <button id="favoriteButton" type="button" class="rounded-md border border-neutral-700 bg-neutral-800 px-5 py-2 text-sm font-medium text-white hover:bg-neutral-700">
                            Add to Favorites
                        </button>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <script type="module" src="../src/js/pages/details.js"></script>
</body>
</html>
