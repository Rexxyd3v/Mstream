<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details | MStream</title>
    <link rel="icon" type="image/png" href="../assets/letter-m.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../dist/output.css">
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen">

    <!-- NAV -->
    <header class="glass-nav sticky top-0 z-50">
        <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8">
            <a href="./home.html" class="flex items-center gap-2.5 shrink-0">
                <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-neutral-300 to-neutral-500 shadow-lg">
                    <svg class="h-4 w-4 text-black" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z"/>
                    </svg>
                </div>
                <span class="text-lg font-bold tracking-tight text-white">MStream</span>
            </a>
            <nav aria-label="Main navigation" class="hidden items-center gap-1 text-sm md:flex">
                <a href="./home.html" class="rounded-lg px-3.5 py-2 text-neutral-400 hover:bg-white/5 hover:text-white">Home</a>
                <a href="./movies.html" class="rounded-lg px-3.5 py-2 text-neutral-400 hover:bg-white/5 hover:text-white">Movies</a>
                <a href="./tv-series.html" class="rounded-lg px-3.5 py-2 text-neutral-400 hover:bg-white/5 hover:text-white">TV Series</a>
                <a href="./favorites.html" class="rounded-lg px-3.5 py-2 text-neutral-400 hover:bg-white/5 hover:text-white ">Favorites</a>
            </nav>
            <!-- Back button -->
            <button onclick="history.back()" class="hidden items-center gap-1.5 rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-sm text-neutral-300 transition hover:bg-white/10 hover:text-white sm:flex">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                Back
            </button>
        </div>
    </header>

    <main id="movieDetails" class="mx-auto max-w-5xl px-4 py-10 sm:px-6 lg:px-8">

        <!-- Breadcrumb -->
        <nav class="mb-6 flex items-center gap-2 text-sm text-neutral-500">
            <a href="./home.html" class="hover:text-white">Home</a>
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            <span class="text-neutral-300">Details</span>
        </nav>

        <!-- Detail card -->
        <div class="overflow-hidden rounded-3xl border border-white/6 bg-neutral-900/60 card-inner-glow shadow-[0_32px_80px_rgba(0,0,0,0.7)]">

            <!-- Poster backdrop strip (decorative) -->
            <div class="h-2 w-full bg-gradient-to-r from-neutral-800 via-neutral-700 to-neutral-800 opacity-60"></div>

            <div class="flex flex-col gap-8 p-6 sm:p-8 md:flex-row md:items-start">

                <!-- Poster -->
                <div class="shrink-0 md:w-56 lg:w-64">
                    <div class="relative overflow-hidden rounded-2xl shadow-[0_24px_60px_rgba(0,0,0,0.7)]">
                        <img
                            id="detailPoster"
                            src="https://image.tmdb.org/t/p/w500/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg"
                            alt="Movie poster"
                            class="h-auto w-full object-cover"
                            loading="eager"
                        >
                        <!-- Overlay shimmer on load -->
                        <div class="pointer-events-none absolute inset-0 bg-gradient-to-t from-black/30 to-transparent"></div>
                    </div>
                </div>

                <!-- Info -->
                <div class="flex-1 min-w-0">
                    <span class="inline-block rounded-full border border-white/10 bg-white/5 px-3 py-1 text-[10px] font-semibold uppercase tracking-widest text-neutral-400">Now Showing</span>

                    <h1 id="detailTitle" class="mt-3 text-3xl font-black tracking-tight text-white sm:text-4xl">Movie Title</h1>

                    <p id="detailOverview" class="mt-4 text-sm leading-7 text-neutral-400">
                        Movie overview will appear here.
                    </p>

                    <!-- Meta chips -->
                    <div class="mt-6 flex flex-wrap gap-3">
                        <div class="rounded-xl border border-white/6 bg-white/4 card-inner-glow px-4 py-3">
                            <p class="text-[10px] uppercase tracking-widest text-neutral-500">Release Date</p>
                            <p id="detailDate" class="mt-1 text-sm font-semibold text-white">—</p>
                        </div>
                        <div class="rounded-xl border border-white/10 bg-white/5 px-4 py-3">
                            <p class="text-[10px] uppercase tracking-widest text-neutral-500">TMDB Rating</p>
                            <p id="detailRating" class="mt-1 flex items-center gap-1 text-sm font-semibold text-white">
                                <svg class="h-3.5 w-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                                —
                            </p>
                        </div>
                    </div>

                    <!-- Action buttons -->
                    <div class="mt-8 flex flex-wrap gap-3">
                        <button id="watchButton" type="button" class="inline-flex items-center gap-2 rounded-xl bg-white px-6 py-3 text-sm font-semibold text-black shadow-lg transition hover:bg-neutral-200 active:scale-95 ripple">
                            <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/></svg>
                            Watch Now
                        </button>
                        <button id="favoriteButton" type="button" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/5 px-6 py-3 text-sm font-semibold text-white transition hover:bg-white/10 active:scale-95 ripple">
                            <svg class="h-4 w-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                            Add to Favorites
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="mt-16 border-t border-white/6 py-8">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col items-center justify-between gap-3 sm:flex-row">
                <p class="text-sm font-semibold text-white">MStream</p>
                <p class="text-xs text-neutral-600">Free streaming powered by TMDB</p>
            </div>
        </div>
    </footer>

    <script type="module" src="../src/js/pages/details.js"></script>
    <script type="module" src="../src/js/effects.js"></script>
    <script type="module" src="../src/js/auth.js"></script>
</body>
</html>
